<section id="crop-tool" class="tool">
  <div class="container tool__inner">
    <div class="tool__header">
      <span class="eyebrow">The crop tool</span>
      <h2 class="tool__title">Crop your image</h2>
      <p class="tool__description">
        Upload an image, drag it into position, then download your 1080×1350 crop.
      </p>
    </div>

    <div class="tool__card">
      <input
        #fileInput
        type="file"
        [accept]="acceptedExtensions"
        (change)="onFileSelected($event)"
        class="file-input"
      />

      @if (!hasImage()) {
        <button
          type="button"
          class="upload-zone"
          [class.upload-zone--active]="isDragOver()"
          (click)="fileInput.click()"
          (dragenter)="onDragEnter($event)"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
        >
          <div class="upload-zone__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </div>
          <p class="upload-zone__label">Click to upload an image</p>
          <p class="upload-zone__hint">
            Supports {{ acceptedExtensionsDisplay }}
          </p>
        </button>
      }

      @if (errorMessage()) {
        <p class="error" role="alert">{{ errorMessage() }}</p>
      }

      @if (hasImage()) {
        <div class="crop-container">
          <app-carousel-size-selector
            [selectedSize]="carouselSize()"
            (sizeChange)="setCarouselSize($event)"
          ></app-carousel-size-selector>

          <div
            #frame
            class="crop-frame"
            [style.--carousel-size]="carouselSize()"
            (mousedown)="onMouseDown($event)"
            (touchstart)="onTouchStart($event)"
            (window:mousemove)="onMouseMove($event)"
            (window:touchmove)="onTouchMove($event)"
            (window:mouseup)="onDragEnd()"
            (window:touchend)="onDragEnd()"
          >
            <button
              type="button"
              class="crop-frame__close"
              aria-label="Remove image"
              (click)="closeImage($event)"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
            <img
              #image
              [src]="imageUrl()"
              (load)="onImageLoad()"
              alt="Image to crop"
              class="crop-image"
              draggable="false"
            />
          </div>
          <div class="crop-actions">
            <button type="button" class="button button--secondary" (click)="fileInput.click()">
              Choose another image
            </button>
            <button type="button" class="button button--primary" (click)="downloadCrop()">
              {{ carouselSize() === 1 ? 'Download crop' : 'Download carousel' }}
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</section>

<canvas #canvas class="crop-canvas"></canvas>
