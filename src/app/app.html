<main class="main">
  <h1>Carousel Cropper</h1>

  <input
    #fileInput
    type="file"
    [accept]="acceptedExtensions"
    (change)="onFileSelected($event)"
    class="file-input"
  />

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  @if (hasImage()) {
    <div class="crop-container">
      <div
        #frame
        class="crop-frame"
        (mousedown)="onMouseDown($event)"
        (touchstart)="onTouchStart($event)"
        (window:mousemove)="onMouseMove($event)"
        (window:touchmove)="onTouchMove($event)"
        (window:mouseup)="onDragEnd()"
        (window:touchend)="onDragEnd()"
      >
        <img
          #image
          [src]="imageUrl()"
          (load)="onImageLoad()"
          alt="Image to crop"
          class="crop-image"
          draggable="false"
        />
      </div>
      <button class="download-button" (click)="downloadCrop()">Download Crop</button>
    </div>
  }

  <canvas #canvas class="crop-canvas"></canvas>
</main>
